name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/requirements-definition-dev-hm7c3n
      - main
      - master
  workflow_dispatch:

# GITHUB_TOKEN に Pages への書き込みと OIDC を許可
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は最新のみ（進行中はキャンセルしない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Pages はリポジトリ設定で「Source: GitHub Actions」を一度だけ有効化しておく必要がある
      # （Actions のトークンでは初回自動作成ができないため）
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
